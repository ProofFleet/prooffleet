name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Cancel superseded runs of the same PR (agents push fixups; the stale run's
# result is dead on arrival). Push/dispatch runs are never grouped — run_id is
# unique — so every main commit keeps its own verification + cache save.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # a toolchain bump is a cold build: ~20 min on 14 cores locally
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PR metadata (Problem Card linkage)
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -e

          BASE_REF="${{ github.base_ref }}"
          # Ensure we can diff against base.
          git fetch origin "$BASE_REF" --depth=1 || true

          CHANGED=$(git diff --name-only "origin/$BASE_REF"...HEAD || true)
          if printf "%s\n" "$CHANGED" | grep -qE '^MoltResearch/'; then
            NUCLEUS=1
          else
            NUCLEUS=0
          fi

          OVERLAY_PATH="Learning/EDUCATIONAL_OVERLAYS.md"
          CANONICAL_REGEX='^(MoltResearch/Basics\.lean|MoltResearch/Logic\.lean|MoltResearch/Discrepancy/Basic\.lean)$'
          if printf "%s\n" "$CHANGED" | grep -qE "$CANONICAL_REGEX"; then
            CANONICAL_CHANGED=1
          else
            CANONICAL_CHANGED=0
          fi
          if printf "%s\n" "$CHANGED" | grep -qE "^${OVERLAY_PATH}$"; then
            OVERLAY_CHANGED=1
          else
            OVERLAY_CHANGED=0
          fi

          BODY=$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")

          CARD=$(printf "%s\n" "$BODY" | sed -n 's/^Card:[[:space:]]*//Ip' | head -n 1 | tr -d '\r')
          TRACK=$(printf "%s\n" "$BODY" | sed -n 's/^Track:[[:space:]]*//Ip' | head -n 1 | tr -d '\r')
          ITEM=$(printf "%s\n" "$BODY" | sed -n 's/^Checklist item:[[:space:]]*//Ip' | head -n 1 | tr -d '\r')

          MISSING=0
          if [[ -z "$CARD" ]]; then
            echo "::warning::PR body missing 'Card: Problems/<card>.md' (use N/A if not applicable)."
            MISSING=1
          fi
          if [[ -z "$TRACK" ]]; then
            echo "::warning::PR body missing 'Track: A|B|C' (use N/A if not applicable)."
            MISSING=1
          fi
          if [[ -z "$ITEM" ]]; then
            echo "::warning::PR body missing 'Checklist item:' (use N/A if not applicable)."
            MISSING=1
          fi

          # Hard gate for nucleus work.
          if [[ "$NUCLEUS" == "1" && "$MISSING" == "1" ]]; then
            echo "::error::This PR touches MoltResearch/ (verified nucleus). Please add Card/Track/Checklist item lines to the PR body (N/A allowed)."
            exit 1
          fi

          # Canonical-module overlay hygiene.
          if [[ "$CANONICAL_CHANGED" == "1" && "$OVERLAY_CHANGED" == "0" ]]; then
            echo "::error::This PR changes designated canonical MoltResearch modules but does not update $OVERLAY_PATH."
            echo "::error::Please add a concise overlay update (intuition/proof pattern/common pitfalls), or include a no-op clarification entry."
            exit 1
          fi

          # Additional validation (only when nucleus + fields present).
          if [[ "$NUCLEUS" == "1" && "$MISSING" == "0" ]]; then
            if [[ "$TRACK" != "A" && "$TRACK" != "B" && "$TRACK" != "C" && "$TRACK" != "N/A" && "$TRACK" != "n/a" ]]; then
              echo "::error::Track must be A, B, C, or N/A (got: $TRACK)"
              exit 1
            fi

            if [[ "$CARD" != "N/A" && "$CARD" != "n/a" ]]; then
              if [[ ! -f "$CARD" ]]; then
                echo "::error::Card file not found: $CARD"
                exit 1
              fi
              if [[ "$ITEM" != "N/A" && "$ITEM" != "n/a" ]]; then
                if ! grep -qF -- "- [ ] $ITEM" "$CARD" && ! grep -qF -- "- [x] $ITEM" "$CARD"; then
                  echo "::error::Checklist item not found as a checkbox in $CARD: $ITEM"
                  exit 1
                fi
              fi
            fi
          fi

      - name: Check task metadata coverage
        run: python3 scripts/check_task_metadata_coverage.py

      # Toolchain-free gates, all grep/regex. They run before elan and the caches so a
      # sorry, an axiom, a layering violation or an interface regression fails in seconds
      # rather than after a minute of cache restores or a full build. Mirrors `make ci`,
      # which has always run the forbid scripts before the build.
      - name: Check library layering
        run: bash scripts/check_layering.sh

      - name: Check interface hygiene (warning mode)
        run: python3 scripts/check_interfaces.py

      - name: Check every module is compiled by CI
        run: python3 scripts/check_aggregator_coverage.py

      - name: Forbid sorry in verified targets
        run: bash scripts/forbid_sorry.sh

      - name: Forbid axiom/unsafe in verified targets
        run: bash scripts/forbid_axiom_unsafe.sh

      - name: Install elan
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # ubuntu-latest ships ~20 GB of toolchains this build never touches, and the runner
      # arrives 98% full once .lake is populated — measured on this workflow: 72 G disk,
      # 1.8 G available, .lake/packages 6.9 G, .lake/build 1.3 G. actions/cache/save writes
      # its tar to that same filesystem, so a 6.9 GB packages tree could not be archived at
      # all and the deps cache failed to save on every run (silently — the action only warns).
      # Reclaiming is what makes the deps cache viable, and it is why the deps cache is
      # kept rather than dropped: `lake exe cache get` costs 2m30s a run because it clones
      # Mathlib's source as well as fetching oleans, against ~60 s to restore the archive.
      # hostedtoolcache is left alone apart from CodeQL — python3 lives there.
      # Since Lean/Mathlib v4.35 a cold build no longer fits either: run 36288498532 died with
      # `no space left on device` at module 9341 of 9483. So the reclaim now runs on every run,
      # before .lake is populated, rather than only before the cache saves.
      - name: Reclaim runner disk
        run: |
          before="$(df --output=avail -BG / | tail -1 | tr -dc '0-9')"
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/share/swift \
                      /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          docker image prune -af >/dev/null 2>&1 || true
          after="$(df --output=avail -BG / | tail -1 | tr -dc '0-9')"
          echo "reclaimed disk: ${before}G -> ${after}G available"
          df -h /

      # Two caches, split at the immutability boundary.
      #
      # .lake/packages (Mathlib sources + its prebuilt oleans, ~2 GB) changes only when
      # lean-toolchain or lake-manifest.json changes, so it is keyed on exactly those and
      # written once per bump. .lake/build (this repo's own oleans) changes every commit, so
      # it is keyed per-sha with a prefix fallback.
      #
      # Before the split, one ~2.4 GB entry was re-tarred and re-uploaded on every main push.
      # That ~57 s save is what the merge cadence outruns: at ~30 merges/day runs start before
      # the previous run has published, fall back to an older prefix match, and rebuild the
      # whole analytic cone — turning a 1.5-minute build into 23 minutes. Writing only the
      # small half per push shortens that window, cuts eviction pressure against the 10 GB
      # repo budget, and makes running out of space while writing the tar far less likely.
      - name: Restore Mathlib/deps cache
        id: deps-cache
        uses: actions/cache/restore@v5
        with:
          path: ./.lake/packages
          key: lake-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}

      - name: Restore Lake build cache
        id: build-cache
        uses: actions/cache/restore@v5
        with:
          path: ./.lake/build
          key: lake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-

      # Cold deps only (first run after a toolchain/mathlib bump): fetch the
      # prebuilt Mathlib oleans instead of compiling Mathlib from source.
      - name: Get Mathlib cache (cold deps only)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: ~/.elan/bin/lake exe cache get

      # How stale is the build cache we actually got? This is the number that explains a slow
      # run: an exact hit rebuilds only what this commit touched, while a match N commits back
      # rebuilds everything those N commits touched. Printed every run so the correlation
      # between staleness and wall-clock is visible without digging through logs.
      - name: Report build-cache freshness
        run: |
          matched='${{ steps.build-cache.outputs.cache-matched-key }}'
          primary='${{ steps.build-cache.outputs.cache-primary-key }}'
          if [ -z "$matched" ]; then
            echo "build cache: MISS (cold) - full rebuild expected"
            echo "build cache: MISS (cold)" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$matched" = "$primary" ]; then
            echo "build cache: exact hit for this commit"
            echo "build cache: exact hit" >> "$GITHUB_STEP_SUMMARY"
          else
            base="${matched##*-}"
            behind="$(git rev-list --count "$base..HEAD" 2>/dev/null || echo '?')"
            echo "build cache: prefix hit on $base - $behind commit(s) behind HEAD"
            echo "build cache: stale by $behind commit(s) (base $base)" >> "$GITHUB_STEP_SUMMARY"
          fi

      # One invocation, every target. The default target only builds what
      # MoltResearch.lean imports; the standalone audit/regression modules, the
      # Solutions lib, and the Tasks/Conjectures backlog must be listed
      # explicitly or they silently decay (NormalFormExamples once accumulated
      # ~95 compile errors unnoticed; a false Stage-2 stub axiom sat unnoticed —
      # issue #2843). This list is the canonical CI target set; `make ci`
      # mirrors it.
      # Cheap structural gates: pure grep/regex, about a second each, and they run before the
      # build so a layering or interface regression reports in seconds rather than after a
      # full compile.
      - name: Build all targets
        run: |
          targets="$(grep -vE '^[[:space:]]*(#|$)' scripts/ci_targets.txt | tr '\n' ' ')"
          if [ -z "${targets// /}" ]; then
            echo "::error::no build targets resolved from scripts/ci_targets.txt"
            exit 1
          fi
          echo "Building: $targets"
          ~/.elan/bin/lake build $targets

      # A cache save that fails is invisible by default: actions/cache/save only emits a
      # warning, so the run stays green while every later run silently falls back to an older
      # entry. One such failure has been observed (`zstd: error 70 ... No space left on
      # device` while writing the ~2.4 GB tar). Record the disk state a failure would be
      # blamed on, so the next occurrence is diagnosed rather than guessed at.
      - name: Disk and cache size before save
        run: |
          echo "== blocks ==" ; df -h /
          echo "== inodes ==" ; df -i /
          echo "== sizes ==" ; du -sh .lake/build .lake/packages 2>/dev/null || true

      - name: Save Mathlib/deps cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ./.lake/packages
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      # PR-branch caches are invisible to other PRs, so saving them buys nothing
      # for the fleet and evicts useful main-branch entries. Save from main pushes
      # only — except a total cache miss on a PR (a toolchain/mathlib bump PR),
      # which checkpoints so that PR's next push is warm.
      - name: Save Lake build cache
        if: >
          steps.build-cache.outputs.cache-hit != 'true' &&
          (github.event_name != 'pull_request' ||
           steps.build-cache.outputs.cache-matched-key == '')
        uses: actions/cache/save@v5
        with:
          path: ./.lake/build
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      # Did they actually land? lookup-only re-queries the key without downloading.
      - name: Verify the deps cache persisted
        id: verify-deps
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v5
        with:
          path: ./.lake/packages
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}
          lookup-only: true

      - name: Verify the build cache persisted
        id: verify-save
        if: >
          steps.build-cache.outputs.cache-hit != 'true' &&
          (github.event_name != 'pull_request' ||
           steps.build-cache.outputs.cache-matched-key == '')
        uses: actions/cache/restore@v5
        with:
          path: ./.lake/build
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
          lookup-only: true

      # Deliberately an annotation, not a failed job: a lost cache costs the *next* run time,
      # and turning main red for it would trip the ci-main-red response for something no
      # revert can fix. The annotation and summary line make it impossible to miss.
      - name: Report a lost cache save
        if: >
          (steps.verify-save.outcome == 'success' &&
           steps.verify-save.outputs.cache-hit != 'true') ||
          (steps.verify-deps.outcome == 'success' &&
           steps.verify-deps.outputs.cache-hit != 'true')
        run: |
          if [ '${{ steps.verify-deps.outcome }}' = 'success' ] \
             && [ '${{ steps.verify-deps.outputs.cache-hit }}' != 'true' ]; then
            echo "::error::Mathlib/deps cache save did not persist - every later run pays 2m30s for 'lake exe cache get'. See the disk report above."
            echo "WARNING: deps cache save did not persist" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ '${{ steps.verify-save.outcome }}' = 'success' ] \
             && [ '${{ steps.verify-save.outputs.cache-hit }}' != 'true' ]; then
            echo "::error::Build cache save did not persist - later runs will fall back to an older cache and rebuild more. See the disk report above."
            echo "WARNING: build cache save did not persist" >> "$GITHUB_STEP_SUMMARY"
          fi
