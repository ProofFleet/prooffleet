      models:
        - "Claude Fable 5"
        - "Claude Opus 5"
        - "Claude Fable 5.1"
      framework: "Claude Code"
      tool_setup: >-
        From July to early September 2026, Claude Code sessions acted as the conductor, writing
        Problem Cards, design reports and worker briefs, and as workers writing Lean, each unit
        landing as a squash-merged pull request once CI passed. CI builds every CI target, runs
        grep gates against sorry, axiom and unsafe in the verified trees, and checks #guard_msgs
        pins on the #print axioms output of the flagship theorems.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "not tracked"
      prompting_notes: >-
        Briefs and worker reports are in Problems/tao2015_*_brief.md and
        Problems/tao2015_*_report.md; session transcripts are not part of the repository.
    - method: "agent"
      models:
        - "gpt-5.6-sol"
      framework: "OpenAI Codex"
      tool_setup: >-
        Twenty-six Codex worker runs between 4 and 8 September 2026 (reasoning effort xhigh),
        each executing one brief written by the conductor on a vex/ branch, recorded in
        Problems/tao2015_a1_r6r7_design_report.md.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "not tracked"
      prompting_notes: "The briefs are the prompts; they are kept with the reports in Problems/."
    - method: "agent"
      models: []
      framework: "not recorded"
      tool_setup: >-
        From February to April 2026, commits under the agent identities Vex and JvN built the
        discrepancy definitions and the stage-interface scaffolding that the later campaign
        completed. The models behind these identities are not recorded in the repository.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "not tracked"
  spend_usd: "not tracked"
  notes: >-
    The mathematics was written by AI agents. Sean Huver set up the repository and its
    continuous integration, chose the campaigns and merged pull requests on green CI; no human
    mathematical review of the proof is recorded. The records of the July–September campaign
    that produced the proof (cards, design reports, briefs, worker reports, including the
    design errors that workers' stop-reports caught) are in Problems/. They are the authors'
    own account; transcripts and costs were not kept. Two other experiments in the same
    repository are not part of this result: a three-agent pilot on another card
    (Problems/nucleus_upstreaming_report.md) and a multi-agent research run on other Erdős
    problems (Problems/erdos_research_report.md). The Palomar packaging (PalomarEDP/, this file,
    comparator.json) and the move to Lean v4.35.0-rc2 were prepared with Claude Code (Claude
    Opus 5.5) in September 2026.

fidelity:
  divergences: >-
    Scope: only ±1 sequences valued in ℤ; Tao's Theorem 1.1 is not formalized. Encoding: the
    stochastic multiplicative functions of Theorem 1.8 take values in ℂ with almost-sure
    unimodularity rather than in the unit circle; complete multiplicativity is guarded at 0; the
    limit in the Fourier reduction is taken through an ultrafilter and Prokhorov's theorem.
    Intermediate statements that differ from the sources, each recorded as weaker than or
    different from its source in the repository: Proposition 1.11 with a per-sample existential
    rather than a measurable selection and its constant fixed before ε; Tao's Theorem 1.3
    (companion paper) for completely multiplicative functions, conjugate pairs and natural shifts
    only; in Section 4, a weaker conclusion than the Vinogradov–Korobov input Tao uses, proved
    instead from an elementary van der Corput bound for zeta and a character-removing argument
    (the interface keeps the name VinogradovKorobovAssumption); a zero-free region of Chudakov
    strength, reached through a weak form of Vinogradov's mean value theorem, in place of the
    Vinogradov–Korobov region used by Matomäki and Radziwiłł, with Lemma 8's exponent 2/3 + ε
    replaced by a fixed exponent and an existential constant; on the major arcs, a fixed-strength
    form of Theorem A.2 of Matomäki–Radziwiłł–Tao applied to each twist instead of the c_p = 1
    shortcut, which presumes bounded denominators, with a restructured exceptional-set estimate.
    Some constants are explicit (for example 64 in the Halász–Montgomery inequality); others are
    existential or obtained by compactness or choice, so the proof yields no explicit bound.
    The conclusion is unaffected: the statement of record is exactly the source's Corollary 1.2.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    On 27 September 2026 Sean Huver, the listed author and responsible maintainer, reviewed the
    statement of record, PalomarEDP/Challenge.lean. That is the author's own check, not an
    independent review. The Challenge was written and checked against Tao's Corollary 1.2 by the
    agent that prepared this packaging (docs/edp-release.md, "Statement review"). No human
    mathematical review of the proof is recorded. The checks of the proof are mechanical or were
    carried out by AI agents: Lean's kernel accepts the proof; Comparator (in the toolchain's lake
    comparator) checks that PalomarEDP/Solution.lean proves exactly the statement of
    PalomarEDP/Challenge.lean using only propext, Quot.sound and Classical.choice, with the proof
    replayed by the NanoDa and con-ron kernels; CI pins the axiom footprint of the flagship
    theorems and requires anti-vacuity witnesses for the hypothesis classes used along the way;
    the development also proves the Formal Conjectures statement of Erdős Problem 67 verbatim.
    Design errors found during the campaign were caught by AI workers' stop-reports.

alignment:
  namespace: "EDP"
  statements:
    - source: "Tao, The Erdős discrepancy problem (arXiv:1509.05363), Corollary 1.2"
      lean: "EDP.erdos_discrepancy"
      module: "PalomarEDP.Challenge"
      status: "proved"
      note: >-
        Proved in PalomarEDP.Solution from MoltResearch.erdos_discrepancy by unfolding three
        two-line definitions. The sequence is indexed by ℕ and the hypothesis also constrains
        f 0, which the progressions d, 2d, … with d ≥ 1 never use, so the statement is
        equivalent to the paper's for sequences on the positive integers.
    - source: "Tao, The Erdős discrepancy problem (arXiv:1509.05363), Corollary 1.2"
      lean: "MoltResearch.Tao2015.erdos_discrepancy_unconditional"
      module: "Conjectures.C0002_erdos_discrepancy.src.TrackCStage5PrimeLargeValuesDischarge"
      status: "proved"
      note: "The development's own form, ¬ BoundedDiscrepancy f for every f with IsSignSequence f."
    - source: "Erdős Problem 67 as stated by the Formal Conjectures project"
      lean: "MoltResearch.Erdos67.erdos_67"
      module: "Conjectures.C0002_erdos_discrepancy.src.Erdos67"
      status: "proved"
      note: "The Formal Conjectures statement, copied verbatim; real-valued ±1 sequences and a real threshold C > 0."
    - source: "Tao, The Erdős discrepancy problem (arXiv:1509.05363), Theorem 1.1"
      lean: "none"
      module: "none"
      status: "not formalized"
      note: "The Hilbert-space-valued version."

